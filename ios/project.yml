name: Freeband
options:
  bundleIdPrefix: dev.cobanov
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6U58AKY6F8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Freeband:
    type: application
    platform: iOS
    entitlements:
      path: Freeband/Freeband.entitlements
      properties:
        com.apple.developer.healthkit: true
    sources:
      - path: Freeband
        excludes:
          - "**/*.old"
    info:
      path: Freeband/Info.plist
      properties:
        CFBundleDisplayName: Freeband
        UIAppFonts: [OpenSauceSans-Regular.otf, OpenSauceSans-Medium.otf, OpenSauceSans-SemiBold.otf]
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Freeband uses Bluetooth to talk directly to the band on your wrist.
        NSHealthUpdateUsageDescription: Freeband writes your band steps, heart rate and sleep stages to Apple Health when you choose to export them.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [bluetooth-le]
        CFBundleURLTypes:
          - CFBundleURLName: dev.cobanov.freeband
            CFBundleURLSchemes: [freeband]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.freeband
        PRODUCT_NAME: Freeband
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
